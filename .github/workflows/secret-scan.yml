name: secret-scan
on:
  pull_request:
  push:
    branches: [main]

# Committed-secret scanner: Gitleaks through the Security-owned composite action
# (webpros-security/shared-actions). Security chose gitleaks over TruffleHog in 2022 (SEC Confluence
# "2022-07 Secret scanning tools comparison"). The action installs a pinned, checksum-verified
# gitleaks binary. A backstop to GitHub push protection. SHA-pinned actions, least-privilege token.
permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: { group: org/webpros-cpanel-arc-runners }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # PR: scan only the PR's commits. Push: empty log-opts scans the full cloned history.
      - id: gitleaks
        uses: webpros-security/shared-actions/actions/gitleaks@1b2e0585b558c905c0ac4df1dc11d9d2347b9781 # main 2026-09-29
        with:
          log-opts: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || '' }}
      # The action reports leaks but exits 0 since 1b2e058. This step makes a leak fail the check.
      - name: Fail on leaks
        if: steps.gitleaks.outputs.leaks-found == 'true'
        env:
          LEAKS_COUNT: ${{ steps.gitleaks.outputs.leaks-count }}
        run: |
          echo "::error::Gitleaks found $LEAKS_COUNT leak(s). See the job summary."
          exit 1
