name: secret-scan
on:
  pull_request:
  push:
    branches: [main]

# Committed-secret scanner (TruffleHog, verified-secrets-only — zero false positives on the
# action SHA pins and placeholder env-var names). A backstop to GitHub push protection. Free /
# no org license. SHA-pinned action, least-privilege token.
permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85 # v3.97.9
        with:
          extra_args: --only-verified
