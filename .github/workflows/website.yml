name: website

## https://github.com/peaceiris/actions-hugo
## https://github.com/github-actions-x/hugo
## https://github.com/github-actions-x/commit

on:
  push:
    branches:
      - main
  workflow_dispatch:

# The build job raises this to contents: write to push the docs branch.
permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'cpanel/elevate'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true # Fetch Hugo themes (true OR recursive)
          fetch-depth: 0 # Fetch all history for .GitInfo and .Lastmod
          persist-credentials: false

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: "0.91.2"

      - name: Build
        working-directory: ./docs-website-src
        run: |
          hugo -D

      - name: check delta
        run: |
          git status
          git diff

      - name: push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pubdir="$(mktemp -d)"
          mkdir -p "$pubdir/docs"
          cp -a docs/. "$pubdir/docs/"
          touch "$pubdir/.nojekyll"
          cd "$pubdir"
          git init -q
          git checkout -B docs
          git -c user.email=github.bot@webpros.com \
              -c user.name='GitHub Action' \
              add -A
          git -c user.email=github.bot@webpros.com \
              -c user.name='GitHub Action' \
              commit -m 'Regenerate Documentation Website'
          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" \
            docs
